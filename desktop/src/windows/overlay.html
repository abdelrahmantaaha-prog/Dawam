<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="overlay.css" />
  <title>Rhythm</title>
</head>
<body>
  <div id="card" class="idle">
    <div id="dot"></div>
    <div class="mid">
      <div id="task">Ready to focus</div>
      <div id="sub">Open Rhythm and pick a task</div>
    </div>
    <div class="btns" id="stdBtns">
      <button id="pauseBtn" title="Pause / resume" hidden>&#10074;&#10074;</button>
      <button id="stopBtn" title="Stop session" hidden>&#9632;</button>
      <button id="openBtn" title="Open Rhythm">&#9776;</button>
    </div>
    <div class="btns" id="askBtns" hidden>
      <button id="askWork" class="pill work">Work</button>
      <button id="askDist" class="pill dist">Distraction</button>
      <button id="askLater" title="Ask later">&#10005;</button>
    </div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
