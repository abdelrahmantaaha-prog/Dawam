<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="overlay.css" />
  <title>Dawam</title>
</head>
<body>
  <div id="card" class="idle">
    <div id="dot"></div>
    <div class="mid">
      <div id="task">Ready to focus</div>
      <div id="sub">Open Dawam and pick a task</div>
    </div>
    <div class="btns" id="stdBtns">
      <button id="pauseBtn" title="Pause / resume" hidden>&#10074;&#10074;</button>
      <button id="stopBtn" title="Stop session" hidden>&#9632;</button>
      <button id="openBtn" title="Open Dawam">&#9776;</button>
    </div>
  </div>
  <script src="overlay.js"></script>
</body>
</html>
