<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Outside the bubble</title>
  <link rel="stylesheet" href="pages.css" />
</head>
<body>
  <!-- Shown in a bubble-browser tab in place of a page outside the bubble.
       The page was never fetched. This is a plain file with no bridge to
       Rhythm: everything it says arrives in its address. -->
  <main class="page">
    <div class="mark">&#9711;</div>
    <h1>Not in this bubble</h1>
    <p class="site" id="site"></p>
    <p class="sub" id="sub"></p>
    <div class="row">
      <button id="back" class="btn">Go back</button>
      <button id="again" class="btn ghost">Try again</button>
    </div>
    <p class="note">Once the round ends, “Try again” opens it.</p>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
