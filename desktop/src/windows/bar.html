<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Rhythm bubble bar</title>
  <link rel="stylesheet" href="bar.css" />
</head>
<body>
  <!-- The bubble bar stands where the Windows taskbar was, while a bubble
       runs: the bubble's apps and sites to switch between, File Explorer,
       a box to let a site in, the round's time and the clock. It sits in the
       taskbar's own strip of screen, which Windows keeps reserved, so nothing
       maximized ever goes under it. -->
  <div class="bar">
    <button id="rhythm" class="home" title="Open Rhythm">&#9711;</button>
    <div id="items" class="items"></div>
    <button id="files" class="item fixed" title="File Explorer">
      <svg viewBox="0 0 24 24" width="20" height="20"><path fill="#E8C66A" d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l1.8 2h8.6A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>
    </button>
    <form id="add" class="add">
      <input id="add-site" spellcheck="false" autocomplete="off" placeholder="Let a site in…" />
    </form>
    <div class="spacer"></div>
    <div id="round" class="round"><span id="name" class="name"></span><span id="left" class="left"></span></div>
    <div id="clock" class="clock"><span id="time"></span><span id="date"></span></div>
  </div>
  <script src="bar.js"></script>
</body>
</html>
