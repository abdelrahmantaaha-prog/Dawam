<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="lock.css" />
</head>
<body>
  <!-- There used to be a second button here: hold two and a half seconds to
       step out for five minutes. It is gone on purpose.

       The hold was meant to be friction, and friction is not what it turned
       into. It became the ordinary way to open the laptop — a ritual you
       perform without deciding anything, which is the exact shape of the habit
       commitment mode exists to break. A door with a slow handle is still a
       door.

       So there is one way in now, and it is to say what you are going to do.
       That includes resting: a reward is a legitimate answer, and Dawam's
       focus page will start a round on one. What is no longer on offer is
       opening the machine without answering the question at all. -->
  <div class="lock-wrap">
    <div class="lock-mark">&#9672;</div>
    <h1>Dawam holds the day</h1>
    <p class="lock-sub">The laptop opens when you know what you're working on, and for how long.</p>
    <div class="lock-actions">
      <button id="open-rhythm" class="lock-btn primary">Open Dawam &amp; start a round</button>
    </div>
    <p class="lock-note">Resting counts &mdash; pick a reward and focus on that.</p>
  </div>
  <script src="lock.js"></script>
</body>
</html>
