name: Build Android APK

# GitHub's ubuntu runners already ship a JDK and the Android SDK, so this needs
# nothing installed locally.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write   # needed only by the release step on tags

jobs:
  build:
    runs-on: ubuntu-latest

    # The secret is lifted to JOB level on purpose. The `secrets` context is NOT
    # available in a step-level `if:`, and a step's own `env:` isn't visible to
    # its own `if:` either — so this is the one place it can live and still be
    # testable below.
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      BROKER_URL: ${{ secrets.VITE_BROKER_URL }}
      BROKER_TOKEN: ${{ secrets.VITE_BROKER_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail fast on logic regressions before spending time on Gradle.
      - name: Unit tests
        run: npm test

      # The shared key pool, baked in so the APK has AI out of the box.
      #
      # .env.local is gitignored — deliberately, it is where the local build
      # keeps this — so without this step a CI-built APK shipped with no pool
      # address at all and every AI feature asked for a key the phone did not
      # have. Set VITE_BROKER_URL and VITE_BROKER_TOKEN as repository secrets.
      #
      # This token ends up readable inside the APK. That is understood and is
      # why the pool issues one per app: it is revocable on its own, without
      # taking the other eleven down. Missing secrets are not an error — the
      # build just produces an APK whose keys come from its Settings screen.
      - name: Point the build at the shared key pool
        if: env.BROKER_URL != '' && env.BROKER_TOKEN != ''
        run: |
          {
            echo "VITE_BROKER_URL=$BROKER_URL"
            echo "VITE_BROKER_TOKEN=$BROKER_TOKEN"
          } > .env.local
          echo "Key pool configured for this build."

      # Vite build first: `cap sync` copies dist/ into the Android assets, and
      # dist/ is gitignored so it never exists at checkout time.
      - name: Build web assets
        run: npm run build

      # Capacitor 6 / AGP 8.2 require JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Capacitor sync
        run: npx cap sync android

      # Belt and braces: the repo tracks gradlew 755 with LF endings, but a
      # checkout on a filesystem without the exec bit would still break.
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # Release signing is used only when the keystore secret is present.
      # Without it we ship a debug APK, which installs fine but is signed with a
      # keystore the runner regenerates every run — see the README.
      - name: Decode signing keystore
        id: keystore
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.keystore.outputs.signed == 'true'
        working-directory: android
        env:
          RHYTHM_STORE_FILE: release.keystore
          RHYTHM_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RHYTHM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RHYTHM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build debug APK
        if: steps.keystore.outputs.signed != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "Found $APK"
          cp "$APK" rhythm.apk

      # The account keeps hitting the Actions artifact storage quota, and a
      # failed upload here used to kill the run BEFORE the release step — the
      # signed APK was built and then thrown away. The artifact is a nicety;
      # the release asset is the deliverable. Never let the first block the
      # second.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: rhythm-apk
          path: rhythm.apk
          retention-days: 3

      # Tagging a version also publishes the APK as a release asset, which is
      # far easier to download straight onto a phone than a CI artifact.
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: rhythm.apk
