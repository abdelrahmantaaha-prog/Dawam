name: Build Android APK

# Runs on demand, on pushes to main that touch the app, and on version tags.
# GitHub's ubuntu runners already ship a JDK and the Android SDK, so this needs
# nothing installed locally.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'android/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'vite.config.js'
      - '.github/workflows/android.yml'
    tags: ['v*']

permissions:
  contents: write   # needed only by the release step on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Fail fast on logic regressions before spending time on Gradle.
      - name: Unit tests
        run: npm test

      # Vite build first: `cap sync` copies dist/ into the Android assets, and
      # dist/ is gitignored so it never exists at checkout time.
      - name: Build web assets
        run: npm run build

      # Capacitor 6 / AGP 8.2 require JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Capacitor sync
        run: npx cap sync android

      # Belt and braces: the repo tracks gradlew as executable, but a checkout
      # on a filesystem without the exec bit would still break the build.
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # Release signing is used only when all four secrets are present.
      # Without them we ship a debug APK, which is installable but signed with
      # a keystore the runner regenerates every run — see the README.
      - name: Decode signing keystore
        id: keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        if: steps.keystore.outputs.signed == 'true'
        working-directory: android
        env:
          RHYTHM_STORE_FILE: release.keystore
          RHYTHM_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RHYTHM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RHYTHM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Build debug APK
        if: steps.keystore.outputs.signed != 'true'
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Collect APK
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name '*.apk' | head -1)
          echo "Found $APK"
          cp "$APK" rhythm.apk
          echo "path=rhythm.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: rhythm-apk
          path: rhythm.apk
          retention-days: 30

      # Tagging a version also publishes the APK as a release asset, which is
      # far easier to download straight onto a phone than a CI artifact.
      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: rhythm.apk
